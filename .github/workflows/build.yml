name: Shizuku Lite APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Fix Java Filename
        shell: bash
        run: |
          FILE="app/src/main/java/dev/mertcakh2/shizukulite/MainActivity.java"

          if [ -f "$FILE" ]; then
            mv "$FILE" \
            "app/src/main/java/dev/mertcakh2/shizukulite/MainActivityStub.java"
          fi

      - name: Verify AndroidX
        run: |
          grep "android.useAndroidX=true" gradle.properties

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Lite-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
